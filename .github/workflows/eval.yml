name: Evaluate

# Full end-to-end evaluation with the real LLM. Publishes eval/results/ and the README table,
# which the deployed app shows on its "How well it works" page.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  push:
    branches: [main]
    paths:
      - "recommender/**"
      - "eval/labeled_queries.jsonl"

permissions:
  contents: write

concurrency:
  group: evaluate
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
      LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL || 'openai/gpt-oss-20b' }}
      LLM_MAX_RETRIES: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('recommender/config.py') }}
      - run: pip install -r requirements.txt
      - name: Run evaluation
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::LLM_API_KEY secret not set; running retrieval stages only"
            python -m eval.run_eval --no-llm
          else
            python -m eval.run_eval --pause 10  # Groq free tier: ~8k tokens per minute per model
          fi
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results README.md
          git diff --cached --quiet || git commit -m "eval: refresh results"
          git push
