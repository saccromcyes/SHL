name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  retrieval-quality:
    name: Recommendation quality gate (real embeddings)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('recommender/config.py') }}
      - run: pip install -r requirements.txt
      # Fails the build if retrieval-only Recall@10 drops (no LLM needed).
      - run: python -m eval.run_eval --no-llm --no-write --fail-under-recall 0.55

  free-tier:
    name: Fits Render free tier (512 MB, 0.1 CPU)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t app .
      - name: Start it inside the free-tier limits and send a real request
        run: bash scripts/free_tier_smoke.sh
        env:
          HEALTH: '/health'
          METHOD: 'POST'
          REQ_PATH: '/api/recommend'
          BODY: '{"query": "Java developers who collaborate with business teams, each test under 40 minutes"}'
          EXPECT: '"results"'
