[project]
name = "shl-assessment-recommender"
version = "2.0.0"
description = "Recommend SHL assessments from a job description: multi-query hybrid search, LLM reranking, Recall@10 evaluation."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905", "E501", "SIM905"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
